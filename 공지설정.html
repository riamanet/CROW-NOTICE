</style></head><body><main><h1>CROW</h1><p>NOTICE STUDIO &nbsp; / &nbsp; 길드 공지 편집실</p><div class="tabs"><button class="active" data-tab="auto">자동 생성</button><button data-tab="design">디자인</button><button data-tab="time">시간 편집</button></div><section id="auto"><label>공지 제목</label><input id="title" value="오늘의 일정"><label>공지 내용 (한 줄에 한 항목, 예: 비약쟁탈전 20:00 / 비밀퀘스트 248 249 / 치즈)</label><textarea id="raw">치즈
비약쟁탈전 20:00
비밀퀘스트 248 249</textarea><div class="toolbar" style="margin-top:10px"><button id="parse">내용으로 자동 생성</button><button class="secondary" id="add">+ 항목 직접 추가</button></div><p>자동 생성 후 아래 항목에서 문구와 시간, 색상을 각각 수정할 수 있어요.</p><div id="events"></div></section><section id="design" class="hidden"><div class="row"><div><label>전체 정렬</label><select id="align"><option value="center">가운데</option><option value="left">왼쪽</option><option value="right">오른쪽</option></select></div><div><label>제목 색상</label><input id="titleColor" type="color" value="#30343b"></div></div><div id="sliders"></div><label>항목별 설정</label><p>자동 생성 탭의 각 항목에서 제목 크기, 색상, 정렬을 개별 변경할 수 있어요.</p><button class="secondary" id="reset">디자인 기본값 복원</button></section><section id="time" class="hidden"><label><input id="utc" type="checkbox" checked> UTC 시간 자동 표시 (한국시간 -9시간)</label><label><input id="sort" type="checkbox"> 시작 시간 순서대로 정렬</label><p>이벤트별 시작 시간은 자동 생성 탭에서 수정할 수 있어요. 치즈 시간도 필요하면 항목을 추가해 주세요.</p><div id="times"></div></section><section><div class="row"><strong>실시간 미리보기</strong><span class="pill" id="count">0 / 1000자</span></div><p>게임 내 폰트·줄바꿈과 완전히 동일하지는 않을 수 있어요.</p><div id="preview" class="preview"></div><div class="toolbar" style="margin-top:12px"><button id="copy">게임 코드 복사</button><button class="secondary" id="save">템플릿 저장</button><button class="secondary" id="load">불러오기</button></div><p id="status" aria-live="polite"></p><details><summary>생성된 게임 코드 보기</summary><pre id="code"></pre></details></section></main><script>
const $=id=>document.getElementById(id);const defaults={titleSize:120,itemSize:120,bodySize:100,itemGap:70,lineGap:50,letterSpacing:2};let settings={...defaults};let events=[];let selected='auto';const colors={'치즈':'#FF4D6D','비약쟁탈전':'#8877B8','비밀퀘스트 약탈':'#328F8A','좀비포위전':'#22A699','왕성쟁탈전':'#C56FC0','서버전':'#EF4444'};const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const escapeText=s=>String(s).replace(/</g,'〈').replace(/>/g,'〉');const fmt=h=>String(h).padStart(2,'0');const utc=t=>{if(!/^\d\d:\d\d$/.test(t))return '';const [h,m]=t.split(':').map(Number);return `${fmt((h+15)%24)}:${fmt(m)}`};const valid=t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t);function parseLine(line){let text=line.trim();if(!text)return null;let name=text,desc='',start='';let times=[...text.matchAll(/\b(?:[01]?\d|2[0-3]):[0-5]\d\b/g)].map(m=>m[0].padStart(5,'0'));if(times.length){start=times[0];name=text.replace(/\b(?:[01]?\d|2[0-3]):[0-5]\d\b/g,'').trim().replace(/[\/~–-]\s*$/,'').trim()}let servers=[];if(/비밀\s*퀘스트|약탈\s*서버/.test(name)){servers=[...name.matchAll(/\b\d{3}\b/g)].map(x=>x[0]);name='비밀퀘스트 약탈'}if(/^치즈/.test(name)){name='치즈';if(!start){start='19:00'}}if(!name)name='일정';return {name,desc,start,servers,color:colors[name]||'#328F8A',size:null,align:'inherit'}}function parse(){events=$('raw').value.split('\n').map(parseLine).filter(Boolean);renderEvents();render()}function renderEvents(){let root=$('events');root.innerHTML='';events.forEach((e,i)=>{let el=document.createElement('div');el.className='event';el.innerHTML=`<div class="row"><strong>항목 ${i+1}</strong><button class="secondary" data-del="${i}">삭제</button></div><label>항목명</label><input data-i="${i}" data-k="name" value="${escapeHTML(e.name)}"><label>설명 (선택)</label><input data-i="${i}" data-k="desc" value="${escapeHTML(e.desc)}"><div class="row"><div><label>시작 시간</label><input type="time" data-i="${i}" data-k="start" value="${e.start}"></div></div><label>서버 번호 (쉼표로 구분)</
